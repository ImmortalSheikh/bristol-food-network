{% extends 'base.html' %}
{% block title %}Delete Review{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0"><i class="bi bi-trash me-2"></i>Delete Review</h4>
        </div>
        <div class="card-body p-4 text-center">
          <p class="mb-1">Are you sure you want to delete your review of</p>
          <h5 class="mb-3">{{ review.product.name }}</h5>
          <p class="text-muted small">"{{ review.title }}" — {{ review.rating }}★</p>
          <p class="text-danger">This cannot be undone.</p>
          <form method="post" class="d-flex gap-2 justify-content-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
            <a href="{% url 'product_detail' pk=review.product.pk %}" class="btn btn-outline-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
